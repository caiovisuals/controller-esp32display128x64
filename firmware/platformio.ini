; Ambiente padrao: ESP32 classico (ESP32-WROOM-32) em placa DevKit de 30 pinos,
; que e' a placa mais provavel para "ESP32 USB-C de 30 pinos" Ver docs/HARDWARE.md
;
; Se a placa for outra, troque o ambiente com:  pio run -e <ambiente> -t upload

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11
lib_deps =
    olikraus/U8g2 @ ^2.35.19

; ESP32 classico (ESP32-WROOM-32): sem USB nativo, o PC ve a ponte USB-UART
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -D OLEDMIRROR_LINK_BAUD=921600
    -D OLEDMIRROR_I2C_SDA=21
    -D OLEDMIRROR_I2C_SCL=22
    -D OLEDMIRROR_I2C_CLOCK=800000

; Variante com I2C a 400 kHz (dentro da especificacao do SSD1306)
; Use se o painel apresentar artefatos a 800 kHz
[env:esp32dev-i2c400]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -D OLEDMIRROR_LINK_BAUD=921600
    -D OLEDMIRROR_I2C_SDA=21
    -D OLEDMIRROR_I2C_SCL=22
    -D OLEDMIRROR_I2C_CLOCK=400000

; Painel em SPI (mais rapido que I2C; ver docs/HARDWARE.md)
[env:esp32dev-spi]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -D OLEDMIRROR_LINK_BAUD=921600
    -D OLEDMIRROR_BUS_SPI=1
    -D OLEDMIRROR_SPI_CS=5
    -D OLEDMIRROR_SPI_DC=16
    -D OLEDMIRROR_SPI_RST=17

; ESP32-S3: tem USB nativo (CDC), o que remove o gargalo da ponte UART
; Use este ambiente se a sua placa for S3
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D OLEDMIRROR_NATIVE_USB=1
    -D OLEDMIRROR_LINK_BAUD=921600
    -D OLEDMIRROR_I2C_SDA=8
    -D OLEDMIRROR_I2C_SCL=9
    -D OLEDMIRROR_I2C_CLOCK=800000

; ESP32-C3 (tambem com USB nativo)
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D OLEDMIRROR_NATIVE_USB=1
    -D OLEDMIRROR_LINK_BAUD=921600
    -D OLEDMIRROR_I2C_SDA=8
    -D OLEDMIRROR_I2C_SCL=9
    -D OLEDMIRROR_I2C_CLOCK=800000

; Testes unitarios do protocolo rodando no PC (sem placa)
;   pio test -e native
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D OLEDMIRROR_NATIVE_TEST=1
    -I src
build_unflags = -std=gnu++11
lib_deps =